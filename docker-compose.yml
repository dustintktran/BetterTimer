services:
  mysql:
    image: mysql:8.0
    container_name: better_timer_db
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=true
    volumes:
      - ./docker/mysql/init-better_timer-db.sql:/docker-entrypoint-initdb.d/init-better_timer-db.sql
    ports:
      - "3306:3306"
  app:
    image: gradle:9.3-jdk21
    container_name: better_timer
    volumes:
      - .:/home/gradle/project
      # Optional: Caches dependencies so it doesn't redownload every time
      - gradle-cache:/home/gradle/.gradle
    working_dir: /home/gradle/project
    environment:
      - DATABASE_HOST=mysql
    depends_on:
      - mysql
    command: ./gradlew run
  frontend:
    build: ./frontend
    image: node:20-alpine
    container_name: better_timer_ui
    volumes:
      - ./frontend:/app
      - /app/node_modules # Anonymous volume to protect node_modules
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true # Ensures hot-reload works in Docker
volumes:
  mysql-data:
    driver: local
  gradle-cache: