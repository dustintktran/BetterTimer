services:
  db:
    container_name: better_timer_db
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: my_db
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3306:3306"

  backend:
    container_name: better_timer_backend
    build: ./backend
    ports:
      - "5001:5000"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: password
    depends_on:
      - db

  frontend:
    container_name: better_timer_ui
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend